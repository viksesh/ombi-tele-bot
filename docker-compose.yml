version: '3.8'

services:
  ombi-tele-bot:
    image: viksesh/ombi-tele-bot:1.1
    container_name: ombi-tele-bot
    restart: unless-stopped
    # Bot uses Telegram polling; the port below serves the mini app
    # (front it with an HTTPS reverse proxy and set WEBAPP_URL to that URL).
    # Webhook is handled by AWS Lambda (see lambda/ directory)
    ports:
      - "${WEBAPP_PORT:-8080}:${WEBAPP_PORT:-8080}"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OMBI_URL=${OMBI_URL}
      - OMBI_API_KEY=${OMBI_API_KEY}
      - OMBI_REQUEST_USER=${OMBI_REQUEST_USER:-}
      - WEBAPP_URL=${WEBAPP_URL:-}
      - WEBAPP_PORT=${WEBAPP_PORT:-8080}
      - ENABLE_GROUP_AUTH=${ENABLE_GROUP_AUTH:-}
      - AUTHORIZED_GROUP_CHAT_IDS=${AUTHORIZED_GROUP_CHAT_IDS:-}
      - MAX_REQUESTS_PER_DAY=${MAX_REQUESTS_PER_DAY:-0}
      # Per-user request history shown in the mini app's "Requests" tab
      - REQUEST_HISTORY_DB=${REQUEST_HISTORY_DB:-/app/data/requests.db}
      - REQUEST_HISTORY_DAYS=${REQUEST_HISTORY_DAYS:-60}
      - NZB_URL=${NZB_URL:-}
      - NZB_API_KEY=${NZB_API_KEY:-}
      - OMBI_AUTO_APPROVE_USER=${OMBI_AUTO_APPROVE_USER:-requests-auto}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}  # Set to WARNING or ERROR to reduce logs
    volumes:
      # Keeps the request history database across container restarts/upgrades
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Rotate at 10MB
        max-file: "5"        # Keep 5 rotated files (50MB total max)
        compress: "true"     # Compress old logs


